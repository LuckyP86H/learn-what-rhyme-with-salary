name: Ruff

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # eMudhra/emSign CA incident (Oct 2026): the pip bundled with Python
      # 3.14.5 predates pip 26.2.2 and keeps trusting the compromised emSign
      # CAs. Bootstrap via the PSF advisory's hash-pinned direct URL.
      - run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install -r requirements.txt
      - run: make lint
